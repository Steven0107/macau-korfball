<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1260px;background:#e9e9ec;font-family:"Noto Sans CJK TC";padding:24px}
.row{display:flex;gap:16px;align-items:center;background:#fff;border-radius:14px;padding:16px;margin-bottom:16px}
.t{width:190px}.t b{font-size:20px;display:block;margin-bottom:6px}.t span{font-size:13px;color:#555;line-height:1.5}
.navy{background:#0F1B33;border-radius:10px;width:420px;height:250px;display:flex;align-items:center;justify-content:center}
.navy img{max-width:380px;max-height:220px}
.white{background:#fff;border:1px solid #ddd;border-radius:10px;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
.white img{width:120px}
.mini{display:flex;flex-direction:column;gap:12px}
.bar{background:#0F1B33;border-radius:8px;width:300px;height:64px;display:flex;align-items:center;padding:0 12px;gap:12px;color:#B8C2D6;font-size:13px;border-bottom:3px solid #FF7A00}
.bar img{width:44px;height:44px}
.tab{background:#dfe1e6;border-radius:8px 8px 0 0;width:200px;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;color:#333}
.tab img{width:16px;height:16px}
.cap{font-size:11px;color:#888}
</style></head><body>
<div class="row"><div class="t"><b>1．籃框徽章</b><span>圓形徽章，中間係合球籃框同一個射緊入去嘅球，外圈寫中英文名。似正式體育總會會徽。</span></div>
<div class="navy"><img src="A-badge.svg"></div><div class="white"><img src="A-badge.svg"></div>
<div class="mini"><div class="cap">網站頂欄 44px</div><div class="bar"><img src="A-icon.svg">本會簡介　賽事資料　…</div><div class="cap">瀏覽器分頁 16px</div><div class="tab"><img src="A-icon.svg">澳門合球總會</div></div></div>

<div class="row"><div class="t"><b>2．蓮花合球</b><span>三塊橙色蓮花瓣托住合球，下面兩條水紋，取自澳門蓮花同海。最有澳門特色。</span></div>
<div class="navy"><img src="B-lotus.svg"></div><div class="white" style="background:#0F1B33"><img src="B-icon.svg"></div>
<div class="mini"><div class="cap">網站頂欄 44px</div><div class="bar"><img src="B-icon.svg">本會簡介　賽事資料　…</div><div class="cap">瀏覽器分頁 16px</div><div class="tab"><img src="B-icon.svg">澳門合球總會</div></div></div>

<div class="row"><div class="t"><b>3．動感方標</b><span>橙色圓角方塊，入面係球飛入籃框嘅弧線，旁邊配粗體中英文字。簡潔現代，做社交媒體頭像最搶眼。</span></div>
<div class="navy"><img src="C-wordmark.svg"></div><div class="white"><img src="C-icon.svg"></div>
<div class="mini"><div class="cap">網站頂欄 44px</div><div class="bar"><img src="C-icon.svg">本會簡介　賽事資料　…</div><div class="cap">瀏覽器分頁 16px</div><div class="tab"><img src="C-icon.svg">澳門合球總會</div></div></div>
</body></html>
