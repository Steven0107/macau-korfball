<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1260px;background:#e9e9ec;font-family:"Noto Sans CJK TC";padding:20px}
.row{display:flex;gap:14px;align-items:center;background:#fff;border-radius:14px;padding:14px;margin-bottom:14px}
.t{width:170px}.t b{font-size:19px;display:block;margin-bottom:6px}.t span{font-size:12.5px;color:#555;line-height:1.5}
.lock{background:#F6F8FB;border:1px solid #DDE3EE;border-radius:10px;width:420px;height:170px;display:flex;align-items:center;justify-content:center}.lock img{width:390px}
.sq{border-radius:10px;width:120px;height:120px;display:flex;align-items:center;justify-content:center;border:1px solid #DDE3EE}.sq img{width:96px}
.navy{background:#14213D;border:none}
.mini{display:flex;flex-direction:column;gap:8px}
.bar{background:#fff;border:1px solid #DDE3EE;border-radius:8px;width:230px;height:60px;display:flex;align-items:center;padding:0 10px;gap:10px;color:#4A5672;font-size:12px;border-bottom:3px solid #FF7A00}.bar img{width:44px;height:44px}
.tab{background:#dfe1e6;border-radius:8px 8px 0 0;width:170px;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;color:#333}.tab img{width:16px;height:16px}
.cap{font-size:11px;color:#888;text-align:center}
</style></head><body>
<div class="row"><div class="t"><b>A．籃環</b><span>一個斷開嘅圓環，球啱啱穿過個缺口，中間係柱同籃。圓環代表 360 度射球同團結。</span></div>
<div class="lock"><img src="A-ring-lockup.svg"></div>
<div><div class="sq"><img src="A-ring-mark.svg"></div><div class="cap">橙色版</div></div>
<div><div class="sq"><img src="A-ring-mark-yellow.svg"></div><div class="cap">黃色球版</div></div>
<div><div class="sq navy"><img src="A-ring-mark-white.svg"></div><div class="cap">深色底</div></div>
<div class="mini"><div class="bar"><img src="A-ring-mark.svg">本會簡介　賽事資料</div><div class="tab"><img src="A-ring-mark.svg">澳門合球總會</div></div></div>
<div class="row"><div class="t"><b>B．「合」字籃</b><span>將「合」字拆開：上面人字頂變成球嘅拋物線，中間一橫，下面個「口」就係合球籃。中文總會獨有。</span></div>
<div class="lock"><img src="B-he-lockup.svg"></div>
<div><div class="sq"><img src="B-he-mark.svg"></div><div class="cap">橙色版</div></div>
<div><div class="sq"><img src="B-he-mark-yellow.svg"></div><div class="cap">黃色球版</div></div>
<div><div class="sq navy"><img src="B-he-mark-white.svg"></div><div class="cap">深色底</div></div>
<div class="mini"><div class="bar"><img src="B-he-mark.svg">本會簡介　賽事資料</div><div class="tab"><img src="B-he-mark.svg">澳門合球總會</div></div></div>
<div class="row"><div class="t"><b>C．一射入籃</b><span>得一條橙色弧線、一個球、一個籃。最簡單，似 IKF 嗰種線條感。</span></div>
<div class="lock"><img src="C-shot-lockup.svg"></div>
<div><div class="sq"><img src="C-shot-mark.svg"></div><div class="cap">橙色版</div></div>
<div><div class="sq"><img src="C-shot-mark-yellow.svg"></div><div class="cap">黃色球版</div></div>
<div><div class="sq navy"><img src="C-shot-mark-white.svg"></div><div class="cap">深色底</div></div>
<div class="mini"><div class="bar"><img src="C-shot-mark.svg">本會簡介　賽事資料</div><div class="tab"><img src="C-shot-mark.svg">澳門合球總會</div></div></div>
</body></html>
