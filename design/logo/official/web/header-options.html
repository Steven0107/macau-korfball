<html><head><style>
body{margin:0;background:#E9EDF3;font-family:'Noto Sans TC','Noto Sans CJK TC',sans-serif;color:#14213D}
.opt{margin:18px 24px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px #0002}
.lab{padding:10px 18px;font-weight:700;font-size:17px;background:#F6F8FB}
.lab small{font-weight:400;color:#4A5672;margin-left:8px;font-size:14px}
header{display:flex;align-items:center;gap:14px;padding:10px 28px;border-bottom:3px solid var(--line);background:#fff}
header img{height:58px}
.nm{line-height:1.15}.nm b{font-size:18px}.nm div{font-size:11px;color:#4A5672}
nav{display:flex;gap:20px;margin-left:24px;font-size:15px;color:#4A5672}
.btn{margin-left:auto;border:2px solid var(--btn);color:var(--btntext);padding:5px 14px;border-radius:6px;font-weight:700;font-size:14px}
.hero{background:var(--hero);padding:30px 28px}
.hero h1{margin:0;font-size:40px}.hero h1 span{color:var(--acc)}
.hero p{margin:6px 0 16px;font-weight:700}
.cta{display:inline-block;background:var(--cta);color:#fff;padding:9px 18px;border-radius:6px;font-weight:700}
</style></head><body>
<div class="opt" style="--line:#FF7A00;--btn:#FF7A00;--btntext:#AD4C00;--hero:#EEF2F8;--acc:#AD4C00;--cta:#FF7A00">
<div class="lab">方案一：保留深藍＋橙<small>logo 用深藍單色，網站顏色唔使改</small></div>
<header><img src="mcka-logo-navy.svg"><div class="nm"><b>澳門合球總會</b><div>Macau China Korfball Association</div></div>
<nav><span>本會簡介</span><span>賽事資料</span><span>裁判事務</span><span>最新消息</span><span>下載區</span></nav><span class="btn">聯繫我們</span></header>
<div class="hero"><h1>澳門<span>合球</span>總會</h1><p>Macau China Korfball Association</p><span class="cta">聯繫我們</span></div></div>
<div class="opt" style="--line:#0B6A12;--btn:#0B6A12;--btntext:#0B6A12;--hero:#EAF3EA;--acc:#0B6A12;--cta:#0B6A12">
<div class="lab">方案二：跟 logo 轉綠色<small>logo 用總會綠，按鈕、線同重點字都轉綠</small></div>
<header><img src="mcka-logo-green.svg"><div class="nm"><b>澳門合球總會</b><div>Macau China Korfball Association</div></div>
<nav><span>本會簡介</span><span>賽事資料</span><span>裁判事務</span><span>最新消息</span><span>下載區</span></nav><span class="btn">聯繫我們</span></header>
<div class="hero"><h1>澳門<span>合球</span>總會</h1><p>Macau China Korfball Association</p><span class="cta">聯繫我們</span></div></div>
</body></html>
