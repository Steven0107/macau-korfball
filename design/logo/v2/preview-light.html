<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:1260px;background:#e9e9ec;font-family:"Noto Sans CJK TC";padding:24px}
.row{display:flex;gap:16px;align-items:center;background:#fff;border-radius:14px;padding:16px;margin-bottom:16px}
.t{width:170px}.t b{font-size:20px;display:block;margin-bottom:6px}.t span{font-size:13px;color:#555;line-height:1.5}
.light{background:#F6F8FB;border:1px solid #DDE3EE;border-radius:10px;width:400px;height:240px;display:flex;align-items:center;justify-content:center}
.light img{max-width:360px;max-height:210px}
.navy{background:#14213D;border-radius:10px;width:150px;height:150px;display:flex;align-items:center;justify-content:center}.navy img{width:120px}
.mini{display:flex;flex-direction:column;gap:10px}
.bar{background:#fff;border:1px solid #DDE3EE;border-radius:8px;width:360px;height:64px;display:flex;align-items:center;padding:0 12px;gap:12px;color:#4A5672;font-size:13px;border-bottom:3px solid #FF7A00}
.bar img{width:44px;height:44px}.cta{border:1.5px solid #AD4C00;color:#AD4C00;border-radius:6px;padding:3px 8px;font-weight:700}
.tab{background:#dfe1e6;border-radius:8px 8px 0 0;width:200px;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;color:#333}.tab img{width:16px;height:16px}
.cap{font-size:11px;color:#888}
</style></head><body>
<div class="row"><div class="t"><b>1．合球籃徽章</b><span>自帶深藍底，淺色同深色背景都清楚。</span></div>
<div class="light"><img src="1-badge.svg"></div><div class="navy"><img src="1-icon.svg"></div>
<div class="mini"><div class="cap">白色頂欄 44px</div><div class="bar"><img src="1-icon.svg">本會簡介　賽事資料　<span class="cta">聯繫我們</span></div><div class="cap">瀏覽器分頁 16px</div><div class="tab"><img src="1-icon.svg">澳門合球總會</div></div></div>
<div class="row"><div class="t"><b>2．360° 合作圈</b><span>淺色底版本：白點同字改深藍，英文用深橙。</span></div>
<div class="light"><img src="2-circle-light.svg"></div><div class="navy"><img src="2-icon.svg"></div>
<div class="mini"><div class="cap">白色頂欄 44px</div><div class="bar"><img src="2-icon.svg">本會簡介　賽事資料　<span class="cta">聯繫我們</span></div><div class="cap">瀏覽器分頁 16px</div><div class="tab"><img src="2-icon.svg">澳門合球總會</div></div></div>
<div class="row"><div class="t"><b>3．動感方標</b><span>淺色底版本：中文字改深藍，英文用深橙。</span></div>
<div class="light"><img src="3-square-light.svg"></div><div class="navy"><img src="3-icon.svg"></div>
<div class="mini"><div class="cap">白色頂欄 44px</div><div class="bar"><img src="3-icon.svg">本會簡介　賽事資料　<span class="cta">聯繫我們</span></div><div class="cap">瀏覽器分頁 16px</div><div class="tab"><img src="3-icon.svg">澳門合球總會</div></div></div>
</body></html>
